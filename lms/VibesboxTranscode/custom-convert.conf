# Vibesbox: decode Tidal MP4 streams with ffmpeg instead of faad.
#
# Tidal hands back MP4 when a track has no FLAC master (Atmos-only releases).
# Plugins::TIDAL::ProtocolHandler::formatOverride relabels that mp4 as "aac",
# and the stock aac->flc rule in convert.conf decodes with faad — which cannot
# parse Tidal's fragmented MP4 and cannot decode an E-AC-3 JOC core at all.
# The player then gets a stream it can't decode and the playlist wedges.
#
# custom-convert.conf is parsed BEFORE convert.conf (loadConversionTables reads
# @convertFiles in reverse), so this claims the base aac-flc-*-* profile and the
# faad rule is demoted to aac-flc-*-*-1.
#
# NOTE: this rule is only reachable with the native aac-aac-*-* profile disabled
# in Settings > Advanced > File Types. Otherwise LMS direct-streams the MP4 to
# the player and never consults a conversion rule at all.
#
# Capabilities are FR, not IF: with R, LMS hands the resolved Tidal CDN URL to
# the script as $URL$ and opens no socket of its own (F does the same with a
# file:// URL for local AAC, which the script decodes in place). It has to
# measure before it can emit anything, and LMS only feeds a converter's stdin
# from inside the read loop that is re-armed by that converter's stdout — so
# under I a measure-first converter would deadlock. Neither mode seeks; nor
# did IF.
#
# LEVEL. An E-AC-3 JOC core decodes to a 5.1 bed mastered to Dolby's music
# ceiling of -18 LKFS, against roughly -8 to -13 LUFS for the stereo masters in
# this library (Tidal's catalogue replayGain for the stereo assets of these same
# albums runs -5.4 .. -10.6 dB, i.e. they sit 5-11 dB above the RG reference).
# The stereo fold-down (-ac 2 / swresample, matrix normalised to prevent
# clipping) lands around -20 LUFS. So the stream needs make-up gain, and the
# gain has to hit E-AC-3 only: the 26 genuine AAC files here have no such
# deficit and must stay bit-identical.
#
# The gain is MEASURED per track, not derived from metadata, because both
# metadata sources are unusable:
#   - dialnorm: the earlier -target_level rule applied target - dialnorm, and
#     Tidal's dialnorm is arbitrary, so identical audio came out anywhere
#     across a 13 dB spread (measured 2026-09-14: -10 LUFS at dialnorm -18,
#     -1 at -27, +3 at -31; the plain decode is dialnorm-invariant at -20.1).
#     That spread IS the "some Atmos tracks are too quiet" complaint.
#   - Tidal's catalogue replayGain/peak: absent (0/0) for some Atmos-only
#     tracks, and where present it is an album-level placeholder for the
#     stereo asset (every Slowdive "everything is alive" track: -10.55 /
#     0.966051). Applied to the Atmos decode via LMS ReplayGain it would cut a
#     stream that is already ~10 dB quiet by another 10.55 dB. Keep
#     replayGainMode OFF on the player.
#
# atmos-transcode.sh runs one ebur128 pass over the first MEASURE (60) seconds
# of the exact decode + fold-down it then emits, and applies gain = min(TARGET - I, CEILING - truepeak) as a
# single static volume — no DRC (drc_scale 0), no limiter, no dynamics. Dense
# masters therefore land below TARGET rather than clip; that is the intended
# ceiling, and the only lossless way to close the remaining gap to a hot
# stereo master is to bring the stereo masters down, not to push these up.
# CEILING carries margin (-3 dBTP) because peaks after the measured window
# are unseen. TARGET, CEILING and MEASURE are the knobs at the top of the
# script.
#
# Codec detection is by the ffmpeg stream line, so a genuine AAC input takes
# the plain decode path below unchanged.
aac flc * *
	# FR
	/config/cache/Plugins/VibesboxTranscode/atmos-transcode.sh $URL$
