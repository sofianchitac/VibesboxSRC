# Vibesbox: decode Tidal MP4 streams with ffmpeg instead of faad.
#
# Tidal hands back MP4 when a track has no FLAC master (Atmos-only releases).
# Plugins::TIDAL::ProtocolHandler::formatOverride relabels that mp4 as "aac",
# and the stock aac->flc rule in convert.conf decodes with faad — which cannot
# parse Tidal's fragmented MP4 and cannot decode an E-AC-3 JOC core at all.
# The player then gets a stream it can't decode and the playlist wedges.
#
# custom-convert.conf is parsed BEFORE convert.conf (loadConversionTables reads
# @convertFiles in reverse), so this claims the base aac-flc-*-* profile and the
# faad rule is demoted to aac-flc-*-*-1.
#
# NOTE: this rule is only reachable with the native aac-aac-*-* profile disabled
# in Settings > Advanced > File Types. Otherwise LMS direct-streams the MP4 to
# the player and never consults a conversion rule at all.
#
# -ac 2 because an E-AC-3 JOC core decodes to 5.1 and every consumer here
# (squeezelite -> 2ch ALSA loopback) is stereo.
#
# These streams arrive far below a stereo master: the 5.1->2.0 fold-down
# attenuates to avoid clipping, ffmpeg's eac3 decoder applies dynamic range
# compression (drc_scale defaults to 1), and the stream's dialnorm tag pulls it
# down again.
#
# Make-up gain is -target_level, NOT an -af volume filter, and that distinction
# is the whole point: target_level and drc_scale are (E-)AC-3 DECODER options —
# the AAC decoder does not implement them — so they lift E-AC-3 Atmos and leave
# a genuine AAC file bit-identical. An -af filter cannot tell the two apart and
# would boost every aac->flc conversion, clipping real AAC tracks (there are 26
# in this library) which have no dialnorm attenuation to recover.
#
# Measured 2026-08-06 on synthetic E-AC-3 and AAC at a -20dBFS reference:
#   E-AC-3   plain -41.9dB -> target_level -16: -26.8dB  (+15.1dB)
#   real AAC plain -44.1dB -> target_level -16: -44.1dB  (unchanged)
# For comparison the earlier `-af volume=12dB` gave E-AC-3 +12.0dB AND real
# AAC +12.0dB.
#
# WHY -8 AND NOT LOWER. target_level normalises the DIALOG level; music peaks
# sit well above it, so pushing toward 0 clips. Measured on a bed with peaks
# 18dB above it (normal-to-conservative crest for music):
#   -16: peak -10.3dB   -12: peak -6.3dB   -8: peak -2.3dB
#    -4: peak  0.0dB (CLIPPING)             -1: peak 0.0dB (CLIPPING)
# From -4 to -1, 3dB more gain yielded only 1.6dB more mean level — the rest
# became flattened peaks. -8 is the practical limit, with ~2.3dB of headroom.
# If a dense master still clips at -8, drop to -10 rather than adding a limiter.
aac flc * *
	# IF
	/config/bin/ffmpeg -loglevel quiet -drc_scale 0 -target_level -8 -i $FILE$ -ac 2 -f flac -compression_level 0 -
