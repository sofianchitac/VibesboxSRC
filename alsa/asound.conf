# ALSA Configuration for Vibesbox SRC
#
# Using 'hw' devices ensures ALSA never performs hidden resampling. All sample-rate
# conversion is explicit: per-source ardftsrc bridges do source-native -> 96k, and
# PipeWire's adaptive resampler absorbs clock drift. Nothing here resamples silently.
#
# Loopback cards are loaded at indices 10-15 (see load_aloop.sh) to avoid
# collisions with hardware cards (UAC2 gadget, eARC I2S). Cards are referenced by their
# id= name so indices are transparent here. (The TOSLINK Pico was retired 2026-08-03.)
#
# ⌀ The named PCMs below are CONVENIENCE ALIASES ONLY — nothing in the repo resolves them.
# Every consumer names its device directly: squeezelite hw:Lyrion,0,0, shairport-sync
# hw:AirPlay,0,0, the ardftsrc bridges hw:UAC2Gadget / hw:Lyrion,1,0 / hw:eARC,0. The
# load-bearing part of this file is the rate_converter line at the bottom.
#
# NDI RX (input from network) is not part of this setup. NDI TX takes CamillaDSP's
# output straight from PipeWire (ALSA `pipewire` plugin, see services/ndi-output.service)
# — the NDITX loopback it used to read was retired 2026-08-21.

# ── USB Gadget (UAC2) ───────────────────────────────────────────────────────
# Provided by libcomposite/dwc2; read directly by ardftsrc-bridge@usb.
pcm.usb_gadget {
    type hw
    card UAC2Gadget
}

# ── Source loopbacks — write side (services → the ardftsrc bridges) ────────

# Lyrion (Squeezelite) loopback — write side
# ardftsrc-bridge@lyrion captures from hw:Lyrion,1,0
pcm.lyrion_out {
    type hw
    card Lyrion
    device 0
    subdevice 0
}

# AirPlay (shairport-sync) loopback — write side
# ardftsrc-bridge@airplay captures from hw:AirPlay,1,0
pcm.airplay_out {
    type hw
    card AirPlay
    device 0
    subdevice 0
}

# ── Global: disable ALSA built-in resampler ─────────────────────────────────
# Any sample-rate mismatch produces an error rather than silent SRC.
# ★ LOAD-BEARING, and the only thing in this file that is. Coarse source-native -> 96k is
# done per-source by the ardftsrc bridges; CamillaDSP runs 96k -> 96k passthrough only.
# (The old "CamillaDSP AsyncSinc VeryHigh" note describes the retired v1 topology.)
defaults.pcm.rate_converter "none"

# ── VibesboxSRC v2 (PipeWire backbone) ──────────────────────────────────────
# The earlier P2 pcm.dsp_in / pcm.dsp_out pipewire-alsa PCMs were REMOVED at P4:
# v2 adopted CamillaDSP's NATIVE PipeWire backend (camilladsp-linux-pipewire prebuilt),
# which registers "dsp-in" / "dsp-out" PipeWire nodes directly — no ALSA-pipewire hop and
# no sink.dsp-in null-sink. source_router.py links sources -> dsp-in and dsp-out -> the
# NDI transmitter's ndi-tx-in node via pw-link. See camilladsp/dsp_8ch.yml.