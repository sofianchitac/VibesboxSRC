# ALSA Configuration for Vibesbox SRC
#
# Using 'hw' devices ensures ALSA never performs hidden resampling.
# All sample-rate conversion is handled exclusively by CamillaDSP.
#
# Loopback cards are loaded at indices 10-15 (see load_aloop.sh) to avoid
# collisions with hardware cards (UAC2 gadget, TOSLINK Pico, eARC I2S).
# Cards are referenced by their id= name so indices are transparent here.
#
# NDI RX (input from network) is not part of this setup.
# NDI TX (6ch output to network) uses the NDITX loopback below.

# ── USB Gadget (UAC2) ───────────────────────────────────────────────────────
# Provided by libcomposite/dwc2; capture side for CamillaDSP 6ch profile.
pcm.usb_gadget {
    type hw
    card UAC2Gadget
}

# ── Source loopbacks — write side (services → CamillaDSP) ──────────────────

# Lyrion (Squeezelite) loopback — write side
# CamillaDSP captures from hw:Lyrion,1,0
pcm.lyrion_out {
    type hw
    card Lyrion
    device 0
    subdevice 0
}

# AirPlay (shairport-sync) loopback — write side
# CamillaDSP captures from hw:AirPlay,1,0
pcm.airplay_out {
    type hw
    card AirPlay
    device 0
    subdevice 0
}

# Bluetooth (bluealsa) loopback — write side
# CamillaDSP captures from hw:Bluetooth,1,0
pcm.bluetooth_out {
    type hw
    card Bluetooth
    device 0
    subdevice 0
}

# ── NDI TX loopback — 6ch output path ──────────────────────────────────────
# CamillaDSP (6ch profile) writes processed audio to sub0.
# The ndi-output daemon reads from sub1 and transmits it as an NDI source.

# Write side — used by CamillaDSP playback (camilladsp_6ch.yml)
pcm.ndi_tx_write {
    type hw
    card NDITX
    device 0
    subdevice 0
}

# Read side — used by ndi-output daemon (ndi_transmitter.py / NDIFreeAudio)
pcm.ndi_tx_read {
    type hw
    card NDITX
    device 1
    subdevice 0
}

# ── Resampled loopback — ARDFTSRC bridge output path ───────────────────────
# ardftsrc-bridge@<source>.service writes pre-resampled 96 kHz audio to sub0.
# CamillaDSP (ARDFTSRC variant configs) reads from sub1 (no further SRC).
# Only active when srcEngine=ardftsrc in auto_router state.

# Write side — used by FFmpeg/librempeg ardftsrc filter
pcm.resampled_write {
    type hw
    card Resampled
    device 0
    subdevice 0
}

# Read side — used by CamillaDSP capture (*_ardftsrc.yml configs)
pcm.resampled_read {
    type hw
    card Resampled
    device 1
    subdevice 0
}


# ── Global: disable ALSA built-in resampler ─────────────────────────────────
# Any sample-rate mismatch produces an error rather than silent SRC.
# All resampling is done by CamillaDSP AsyncSinc VeryHigh.
defaults.pcm.rate_converter "none"

# ── VibesboxSRC v2 (PipeWire backbone) ──────────────────────────────────────
# The earlier P2 pcm.dsp_in / pcm.dsp_out pipewire-alsa PCMs were REMOVED at P4:
# v2 adopted CamillaDSP's NATIVE PipeWire backend (camilladsp-linux-pipewire prebuilt),
# which registers "dsp-in" / "dsp-out" PipeWire nodes directly — no ALSA-pipewire hop and
# no sink.dsp-in null-sink. source_router.py links sources -> dsp-in and dsp-out -> the
# active output sink via pw-link. See camilladsp/dsp_6ch.yml and docs/pipewire-v2-P4-*.md.