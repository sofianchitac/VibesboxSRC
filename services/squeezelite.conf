# Squeezelite Configuration for Vibesbox SRC
# Outputs native sample rates to ALSA loopback.
# Auto-router automatically configures CamillaDSP for async resampling to the fixed output rate.
SL_SOUNDCARD="hw:Lyrion,0,0"
SB_EXTRA_ARGS="-n VibesboxSRC -r 44100,48000,88200,96000,176400,192000,352800,384000 -D -C 5 -a 20"
# -r <rates>       Tell LMS the DAC supports these native rates so it sends them unchanged
# -D               Disable DSD-over-PCM
# -C 5             Close ALSA device after 5s silence (enables auto-router detection)
# -a 20            ALSA buffer 20ms (default 40). squeezelite keeps the loopback playback
#                  buffer ~full, so its occupancy is fixed latency ahead of the ardftsrc
#                  bridge — 40ms default trimmed to 20 (latency-reduction phase 1, 2026-06-10).
#                  Revert to no -a if Lyrion underruns appear in journalctl -u squeezelite.
# No -V flag       LMS handles volume; squeezelite passes full scale to CamillaDSP


