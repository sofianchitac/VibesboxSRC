general = {
  name = "VibesboxSRC";
  interpolation = "basic";
  output_backend = "alsa";
};

alsa = {
  output_device = "hw:AirPlay,0,0";
  mixer_control_name = "";
  disable_synchronization = "no";
};

sessioncontrol = {
  session_timeout = 30;
};

// Metadata for the Now Playing pipeline. ShairportProducer (in
// metadata-orchestrator) reads from this pipe. Requires shairport-sync
// built with --with-metadata --with-dbus-interface (the Debian package
// since Bookworm has both).
metadata = {
  enabled = "yes";
  include_cover_art = "yes";
  pipe_name = "/tmp/shairport-sync-metadata";
  pipe_timeout = 5000;
};

diagnostics = {
  log_verbosity = 0;
};
