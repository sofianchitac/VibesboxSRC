# VibesboxSRC v2 (PipeWire backbone) — high-quality SRC for native source -> 96k (mode A).
# Drop-in merged into /etc/pipewire/pipewire.conf (system-wide instance).
#
# resample.quality scale is 0-15 (default 4; higher = better/heavier). 14 = near-top
# sinc quality, the intent being a clean upsample before the heavy downstream Dirac /
# Penteo DSP on the LattePanda.
#
# Set in stream.properties — the documented global default for pw-stream clients, which
# covers our native source backends: squeezelite (-o pipewire), shairport-sync (pipewire
# backend) and module-bluez5.
#
# NOTE: the USB UAC2 gadget is an ALSA-device source, not a pw-stream client; its
# resampler quality comes from the WirePlumber ALSA-monitor rules, NOT this file. That
# drop-in is authored during the hardware phase (Risk #2 — exact property names).
# PENDING HARDWARE VALIDATION (P1): confirm Pi 4B CPU headroom at q14 (Risk #9).
stream.properties = {
    resample.quality = 14
}
