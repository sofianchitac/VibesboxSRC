# VibesboxSRC v2 (PipeWire backbone) — high-quality SRC for native source -> 96k (mode A).
# Drop-in merged into /etc/pipewire/pipewire.conf (system-wide instance).
#
# resample.quality scale is 0-15 (default 4; higher = better/heavier). 14 = near-top
# sinc quality, the intent being a clean upsample before the heavy downstream Dirac /
# Penteo DSP on the LattePanda.
#
# ⛔ SCOPE, CORRECTED 2026-09-03 — this file reaches ONE live consumer, not three.
# `stream.properties` is DAEMON-side: it applies to streams created inside the PipeWire
# process, and NOT to a separate client process, which gets its own defaults. That is the same
# fact scripts/earc-bitstream-bridge.sh had already established for pw-cat.
#
# So of the three backends this comment used to claim:
#   squeezelite     — writes to hw:Lyrion,0,0 (snd-aloop). Never a pw-stream client. NOT covered.
#   shairport-sync  — output_backend = "alsa", hw:AirPlay,0,0. Also NOT covered.
#   module-bluez5   — in-daemon. ✅ COVERED, and it is the only source that actually resamples
#                     here (A2DP 44.1k -> the 96k graph), so q14 is doing real work for it.
#
# ★ VERIFIED, live, with pw-dump: dsp-in, dsp-out and ndi-tx-in all report resample.quality
# UNSET (PipeWire's default 4). Those are ALSA-`pipewire`-plugin / native clients, i.e. separate
# processes, exactly as the rule above predicts. The ardftsrc bridges' source.<name>.ardftsrc
# nodes are the same kind of client and inherit the same default.
#
# ⌀ AND THAT IS CORRECT, not a gap to close. Every one of those nodes is 96k -> 96k: the coarse
# SRC already happened in ardftsrc upstream, so PipeWire's resampler is there only as the
# drift servo. Forcing q14 on them would buy no quality and spend ~1024 taps of group delay on
# a chain that is fighting for single milliseconds. Do NOT "fix" this by setting q14 wider.
#
# NOTE: the USB UAC2 gadget is an ALSA-device source, not a pw-stream client; its
# resampler quality comes from the WirePlumber ALSA-monitor rules, NOT this file — and that
# node is disabled and dormant anyway (see 52-vibesbox-sources.conf).
# Headroom at q14 has been fine in production since the Pi 5 migration (2026-07); the old
# "PENDING HARDWARE VALIDATION (P1) — Pi 4B" note is retired with the Pi 4B.
stream.properties = {
    resample.quality = 14
}
