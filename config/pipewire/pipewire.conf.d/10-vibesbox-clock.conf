# VibesboxSRC v2 (PipeWire backbone) — pin the graph to a fixed 96 kHz / 512 quantum.
# Drop-in merged into /etc/pipewire/pipewire.conf (system-wide instance).
#
# A single allowed-rate forces PipeWire to resample any 44.1/48k source up to 96k
# (this IS SRC mode A). Fixing min = max = quantum disables the dynamic quantum so the
# graph period stays aligned with CamillaDSP's chunksize and ndi_transmitter.py's
# PERIOD_FRAMES.
#
# 2026-06-10 (latency phase 2): quantum 1024 -> 512. The 2026-06-04 sweep showed 512 is
# stable on the Pi 4B (0 xruns, ~1-2% load) but looked "inert" for latency — that
# inertness is now explained: the ardftsrc bridge's free-floating ring backfilled every
# downstream reduction (in-flight audio is conserved). With the bridge's startup trim
# pinning the ring, quantum reductions can finally stick. Also matches REAPER's ASIO
# buffer (512 since 2026-06-10). Chain coherence: CamillaDSP chunksize, the NDI reader
# loopback periods, NDI_PERIOD and the bridge CAP/OUT periods all moved to 512 together.
context.properties = {
    default.clock.rate          = 96000
    default.clock.allowed-rates = [ 96000 ]
    default.clock.quantum       = 512
    default.clock.min-quantum   = 512
    default.clock.max-quantum   = 512
}
