# VibesboxSRC — the sum bus, as a PipeWire null sink.
# Drop-in merged into /etc/pipewire/pipewire.conf (system-wide instance).
#
# WHY IT EXISTS (2026-09-08): CamillaDSP used to BE the sum node — sources linked into its
# `dsp-in` capture and it passed 8ch through to `dsp-out` -> `ndi-tx-in`. Its original job
# (source-native -> 96 kHz conversion, plus the v1 routing matrix) is gone: resampling moved
# to the ardftsrc bridges and every channel and mix decision moved to REAPER. What was left
# was a 1:1 8ch mixer at gain 0 with `filters: null`, `processors: null`, `resampler: null`
# sitting in the middle of the only audio path. This node replaces it there. CamillaDSP stays,
# on a tap off the same monitor, purely for the RMS its WebSocket feeds to the QML meters and
# to source_router's auto-upmix detector.
#
# ⛔ `node.driver = false` IS LOAD-BEARING, NOT A STYLE CHOICE. A null sink defaults to
# `node.driver = true`. Creating one as a driver into this graph — which is pinned to
# 512 f @ 96 kHz and driven by the timer-based `Dummy-Driver` — forces a driver
# re-negotiation and STALLS THE AUDIO PATH: measured live 2026-09-08, ~8 s of silence, the
# bridge shedding 7 x 10001 f (226.8 ms) of stall backlog from 15:35:44 to 15:35:52 before it
# recovered. Leave the graph on Dummy-Driver.
#
# ⛔ `node.always-process = true` IS ALSO LOAD-BEARING. It is what keeps the monitor emitting
# when no source is linked, and the NDI transmitter needs that: an unlinked `pipewire:` ALSA
# capture stream delivers NOTHING (measured — 46 s, zero bytes), so at idle the sender would
# stall. This is the same duty CamillaDSP used to perform by logging `PipeWire playback: buffer
# empty, outputting silence` 187.5 times a second (99.4 % of a 4.5-day, 10.7 GB log).
# Verified with this property set: monitor delivers 12.70 MB / 4 s against 12.29 MB expected —
# full-rate silence with zero inputs.
#
# ⛔ `audio.position` is load-bearing, as everywhere in this system. It fixes both the input
# port names source_router links sources into (CH8 = FL FR FC LFE RL RR SL SR) and the monitor
# order the NDI transmitter is keyed against positionally. Sum-bus channel N must stay NDI
# channel N. Never reorder here; all mapping lives in REAPER.
#
# `monitor.passthrough = true` keeps the monitor carrying the raw summed input rather than a
# volume-scaled copy, so no volume pin is needed on this node.
# ── The second sink is NOT optional either ────────────────────────────────────────────────
# CamillaDSP still needs a playback device to run its pipeline at all, and an unlinked
# PipeWire playback stream BLOCKS: measured 2026-09-08, `aplay` on an unlinked stream sat
# 148 s having consumed 49 571 bytes in total, `rchar` frozen, against the 3.07 MB/s the
# format implies. So parking `dsp-out` on nothing would stall CamillaDSP — and with it the
# RMS the meters and the auto-upmix detector read. `sink.dsp-void` is where its output goes
# to die. Nothing ever reads that sink's monitor.
context.objects = [
    {   factory = adapter
        args = {
            factory.name              = support.null-audio-sink
            node.name                 = "sink.dsp-sum"
            node.description          = "Vibesbox sum bus (8ch)"
            media.class               = Audio/Sink
            audio.channels            = 8
            audio.position            = [ FL FR FC LFE RL RR SL SR ]
            audio.rate                = 96000
            node.driver               = false
            node.always-process       = true
            node.autoconnect          = false
            monitor.passthrough       = true
            session.suspend-timeout-seconds = 0
        }
    }
    {   factory = adapter
        args = {
            factory.name              = support.null-audio-sink
            node.name                 = "sink.dsp-void"
            node.description          = "Vibesbox metering sink (CamillaDSP output, discarded)"
            media.class               = Audio/Sink
            audio.channels            = 8
            audio.position            = [ FL FR FC LFE RL RR SL SR ]
            audio.rate                = 96000
            node.driver               = false
            node.autoconnect          = false
            monitor.passthrough       = true
            session.suspend-timeout-seconds = 0
        }
    }
]
