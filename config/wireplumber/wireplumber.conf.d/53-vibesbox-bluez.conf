# VibesboxSRC v2 — Bluetooth = A2DP SINK only (the appliance is a BT speaker).
#
# The Pi receives audio FROM phones/tablets/laptops (A2DP sources); it never sends
# audio TO a BT device. With PipeWire's default bluez5 roles (which include a2dp_source
# and hfp_ag) the role negotiation made the Pi an "audio-gateway" (A2DP Source / HFP AG):
# a music phone (itself an A2DP source) then had no matching sink, so the transport
# Acquire returned org.bluez.Error.NotAuthorized and bluez5.profile fell back to "off"
# (no bluez_input node — the source_router "Bluetooth" registry entry had nothing to link).
#
# Restricting to a2dp_sink forces phone(source) -> Pi(sink): a stable
# bluez_input.<MAC>.a2dp-source SOURCE node that reconcile() links into dsp-in by prefix,
# exactly like any other source. It also drops the HFP/telephony leg, which silenced the
# "spa.bluez5.telephony: failed to get session dbus connection" noise (no session bus in
# system mode). Validated live 2026-06-09: Pixel 10 paired fresh, audio played through.
#
# Requires the system-mode WirePlumber to run the `main-systemwide` profile (see
# services/wireplumber.service) so logind seat-monitoring is disabled — the headless
# `pipewire` user has no active seat, and seat-gated bluez never activates devices.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink ]
}
