# VibesboxSRC v2 (PipeWire backbone) — WirePlumber 0.5 SPA-JSON source-side rules.
# Deploy to /etc/wireplumber/wireplumber.conf.d/52-vibesbox-sources.conf.
# Migrated from main.lua.d/52-vibesbox-sources.lua on 2026-05-28 (WP 0.5 dropped Lua).
#
# Scope: the USB UAC2 gadget only. It is the one source that is a real ALSA device, so
# WirePlumber's alsa_monitor governs it. The other sources (squeezelite -o pipewire,
# shairport via pipewire-alsa) reach PipeWire as CLIENT/stream nodes -- alsa_monitor.rules
# do NOT match those. Their autoconnect is controlled by client launch env (PIPEWIRE_PROPS).
# source_router.py is the sole routing authority regardless.
#
# Rule blocks:
#   (1) UAC2 gadget card -- disable ACP so the 6ch raw PCM node appears (not stereo ACP).
#   (2) Pin the gadget capture node -> source.usb @ 6ch FL,FR,FC,LFE,RL,RR
#       with autoconnect off, and DISABLE the node so the ARDFTSRC bridge (ffmpeg) owns the raw
#       hw:UAC2Gadget device. Bench 2026-05-29: ffmpeg opens the raw device even WITHOUT this
#       (WP keeps a consumer-less capture source suspended, holding only controlC*), so
#       node.disabled is hardening against a WP-grab race, not load-bearing. use-acp=false MUST
#       stay so the raw 6ch PCM stays exposed for ffmpeg.
#
# The dwc2 gadget controller's platform address is SoC-specific, so each match lists
# both known names (a matches array is any-of):
#   Pi 4B (BCM2711): fe980000.usb
#   Pi 5  (BCM2712): 1000480000.usb
# VERIFY ON FIRST Pi 5 BOOT: `pw-cli ls Node | grep -i usb` / `wpctl status` — if the
# node name differs, fix it here (and nothing else; the bridge reads hw:UAC2Gadget by
# ALSA card id, which is address-independent).

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-fe980000.usb" }
      { device.name = "alsa_card.platform-1000480000.usb" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-fe980000.usb.capture.0.0" }
      { node.name = "alsa_input.platform-1000480000.usb.capture.0.0" }
    ]
    actions = {
      update-props = {
        node.name          = "source.usb"
        node.description   = "Vibesbox USB gadget input (6ch UAC2)"
        node.autoconnect   = false
        node.disabled      = true   # ARDFTSRC bridge owns hw:UAC2Gadget; WP must not grab it
        node.pause-on-idle = false
        audio.channels     = 6
        audio.position     = "FL,FR,FC,LFE,RL,RR"
        api.alsa.use-chmap = false
        # DORMANT under the locked per-source-split design: USB is fed by the ARDFTSRC
        # bridge (ffmpeg reads hw:UAC2Gadget raw), so this WP node never carries audio and
        # PipeWire never resamples USB. Kept as a defensive default ONLY for a future q14
        # graceful-degradation fallback (not built — see pipewire-v2-ardftsrc-bridge-spec.md).
        # stream.properties resample.quality=14 covers only pw-stream clients, not this
        # ALSA-device node, hence setting it here. If a fallback is ever built, BENCH-VERIFY
        # the prop is honoured on an ALSA-device node (else move to device-rule/api.alsa).
        resample.quality   = 14
      }
    }
  }
  # eARC I2S tap (config/overlays/vibesbox-earc-tap-overlay.dts, Pi 5 only —
  # /soc@107c000000/sound is the BCM2712 sound node). Left alone, WP cannot read a
  # channel map off the I2S slave DAI and publishes a bogus 2ch node
  # ("alsa_input.platform-soc_107c000000_sound.stereo-fallback", FL,FR) that
  # would sit unlinked in the graph and could race a raw capture for the device.
  # Same treatment as USB: expose the raw PCM, keep the WP node out of
  # the way. Channel count/position deliberately NOT set here — the lane->channel
  # map is still unmeasured (see config/overlays/README.md).
  {
    matches = [
      { device.name = "alsa_card.platform-soc_107c000000_sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.platform-soc_107c000000_sound*" }
    ]
    actions = {
      update-props = {
        node.autoconnect   = false
        node.disabled      = true
        node.pause-on-idle = false
      }
    }
  }
]
