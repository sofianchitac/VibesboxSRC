# VibesboxSRC v2 (PipeWire backbone) — WirePlumber 0.5 SPA-JSON output-sink rules.
# Deploy to /etc/wireplumber/wireplumber.conf.d/51-vibesbox-sinks.conf.
# Migrated from main.lua.d/51-vibesbox-sinks.lua on 2026-05-28 (WP 0.5 dropped the Lua
# rules engine; see https://pipewire.pages.freedesktop.org/wireplumber/daemon/configuration/migration.html).
#
# Rule blocks (all merged into the single monitor.alsa.rules array — order matches the
# old Lua table.insert order; WP applies them top-to-bottom against each monitored card/node):
#   (1) NDITX card — disable ACP so raw PCM nodes appear instead of the 2ch ACP profile.
#   (2) Pin alsa_output.platform-snd_aloop.3.playback.0.0 -> sink.ndi-feed @ 6ch/96k/F32LE.
#   (3) Disable 3 stray NDITX raw PCM nodes that use-acp=false also exposes (race-prevent
#       ndi_transmitter.py's raw hw:NDITX,1,0 open).
# (The v2-era rule (4) for the HiFiBerry S/PDIF sink was removed with the Pi 5
# migration — NDI is the only output transport; see git history.)

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-snd_aloop.3" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-snd_aloop.3.playback.0.0" }
    ]
    actions = {
      update-props = {
        node.name           = "sink.ndi-feed"
        node.description    = "Vibesbox NDI feed (8ch -> NDITX)"
        node.pause-on-idle  = false
        audio.format        = "F32LE"
        audio.rate          = 96000
        # 8ch since 2026-08-13 (was 6): the eARC LPCM surrounds ride lanes 7-8 and the
        # old 6-wide chain discarded them. snd-aloop reports CHANNELS: [1 32], so the
        # loopback carries 8 without a modprobe change.
        # ⛔ audio.position is NOMINAL — it only gives the node an 8ch layout. Channel
        # meaning is decided in REAPER; nothing on the Pi may reorder or mix these.
        audio.channels      = 8
        audio.position      = "FL,FR,FC,LFE,RL,RR,SL,SR"
        api.alsa.use-chmap  = false
        # Loopback playback period pinned to 512 (matches the rest of the chain:
        # PipeWire quantum / CamillaDSP chunksize / NDI_PERIOD, and REAPER's ASIO buffer —
        # all moved 1024 -> 512 in the 2026-06-10 latency phase 2). Fixed-latency knob
        # only. NOTE (measured 2026-06-04): this does NOT reduce the ~24ms NDI receive
        # jitter envelope — that proved network/SDK-intrinsic, unchanged across a 2048->512
        # period sweep AND an NDI-frame 1024->512 sweep.
        api.alsa.period-size = 512
        # Continuous-update device (not a batch device) so PipeWire honours the 1024 period
        # instead of inflating it back to the 2048-frame batch default.
        api.alsa.disable-batch = true
        # Clock authority: under CamillaDSP native-PipeWire (node_group_name) the
        # output sink joins the dsp-in/dsp-out domain. priority.driver=3000 bumps
        # this sink above ALSA-source defaults (~2000), so a source cannot seize
        # the clock and be mis-resampled (P3-e fix preserved into 0.5).
        priority.driver     = 3000
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-snd_aloop.3.capture.0.0"   }
      { node.name = "alsa_output.platform-snd_aloop.3.playback.1.0" }
      { node.name = "alsa_input.platform-snd_aloop.3.capture.1.0"   }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
