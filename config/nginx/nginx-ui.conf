# Vibesbox SRC — UI static file server
#
# Serves /opt/vibesbox-src/ui/ on port 80 for the LAN:
#   http://vibesbox-src.local/remote/   — remote stats & config dashboard
# The root touchscreen web dashboard was retired 2026-07-22 (the panel now
# runs the native QML app in ui-qml/); / redirects to /remote/. Root static
# assets (logos etc.) still serve — remote/ references them.
#
# The WebSocket connection (ws://<hostname>:8080) is handled directly by the
# auto-router daemon — nginx does not proxy it.
#
# /breakglass/ reverse-proxies to the DSP unit's VibesboxBreakGlass HTTP
# service. Keeping it same-origin means the dashboard never has to know the
# DSP unit's IP — that detail lives in this config and gets refreshed by
# lattepanda-watcher.timer whenever the mDNS-resolved address changes.
#
# NOTE: `vibesbox-dsp.local` below is a PLACEHOLDER. install.sh rewrites it to
# the value of $DSP_HOST (see /etc/vibesbox/dsp-host) when it deploys this file
# to /etc/nginx/sites-available/vibesbox-ui. Edit the deployed copy, or re-run
# install.sh with DSP_HOST=<your-dsp-hostname>, rather than editing this one.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/vibesbox-src/ui;
    index index.html;

    # Old touchscreen dashboard retired — send the root to the remote UI
    location = / {
        return 302 /remote/;
    }
    location = /index.html {
        return 302 /remote/;
    }

    # Serve files directly; 404 on anything not found (no directory listing)
    location / {
        try_files $uri $uri/ =404;
        autoindex off;
    }

    # Cache static assets aggressively — they only change on deploy
    location ~* \.(css|js|svg|png|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Remote dashboard's break-glass calls.
    # /breakglass/status → http://<dsp-host>:8091/api/breakglass/status
    # nginx resolves the hostname via NSS (libnss-mdns) at startup/reload;
    # lattepanda-watcher.timer (services/) reloads nginx if that IP moves.
    location /breakglass/ {
        proxy_pass http://vibesbox-dsp.local:8091/api/breakglass/;
        proxy_http_version 1.1;
        proxy_set_header Host           $host;
        proxy_set_header X-Real-IP      $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
        # Surface upstream-unreachable as a clear status instead of a 502 HTML page.
        proxy_intercept_errors on;
        error_page 502 504 = @breakglass_offline;
    }
    # Remote dashboard's DSP nudges (volume / bass / treble).
    # /control/bass/up → http://127.0.0.1:8090/api/control/bass/up, which sends
    # OSC on to REAPER. Proxied rather than posted straight at :8090 so the
    # call stays same-origin — a cross-origin POST would fire but the fetch
    # would reject on the missing CORS header.
    location /control/ {
        proxy_pass http://127.0.0.1:8090/api/control/;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
    }

    location @breakglass_offline {
        default_type application/json;
        return 503 '{"ok":false,"error":"breakglass-unreachable"}';
    }

    # Disable access log for this low-traffic local server
    access_log off;
    error_log /var/log/nginx/vibesbox-ui-error.log warn;
}
